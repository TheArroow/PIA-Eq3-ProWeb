<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Fundamental 2 - 2089166 - XML</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navegacion {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        a.btn {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        a.btn:hover {
            background-color: #1a252f;
        }

        .xml-contenedor {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        h2 {
            color: #006633;
            margin-top: 0;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .visor-xml {
            background-color: #2b2b2b;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .visor-xml details {
            margin-left: 20px;
        }

        .visor-xml summary {
            cursor: pointer;
            color: #66d9ef;
            user-select: none;
            outline: none;
        }

        .visor-xml summary:hover {
            text-decoration: underline;
        }

        .visor-xml summary::marker {
            color: #a6e22e;
        }

        .etiqueta-cierre {
            color: #66d9ef;
            margin-left: 20px;
        }

        .texto-contenido {
            color: #e6db74;
        }

        .atributo-nombre {
            color: #a6e22e;
        }

        .atributo-valor {
            color: #fd971f;
        }

        .comentario-xml {
            color: #6a9955;
            font-style: italic;
            margin-left: 20px;
        }

        #btnSubir {
            opacity: 0;
            visibility: hidden;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            font-size: 20px;
            border: none;
            outline: none;
            background-color: #006633;
            color: white;
            cursor: pointer;
            padding: 12px 13px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: opacity 0.4s ease, visibility 0.4s ease, background-color 0.3s, transform 0.3s;
        }

        #btnSubir:hover {
            background-color: #2c3e50;
            transform: scale(1.1);
        }

        #btnSubir.mostrar {
            opacity: 1;
            visibility: visible;
        }
    </style>
    <script src="https://kit.fontawesome.com/beccf43db1.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="navegacion">
        <a href="../index.html" class="btn">⬅ Volver al Index</a>
        <a href="AF06.html" class="btn">Actividad 6 ➡</a>
    </div>

    <div class="xml-contenedor">
        <h2>Actividad Fundamental 2 - 2089166 - XML</h2>

        <div id="vista-xml" class="visor-xml">Cargando información interactiva...</div>
    </div>
    <a href="" id="btnSubir">
        <i class="fa-solid fa-arrow-up"></i>
    </a>

    <script>
        const archivoXML = 'AF02-2089166.xml';

        fetch(archivoXML)
            .then(respuesta => respuesta.text())
            .then(texto => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(texto, "text/xml");

                const contenedor = document.getElementById('vista-xml');
                contenedor.innerHTML = '';

                for (let nodo of xmlDoc.childNodes) {
                    const elementoVisual = construirArbolColapsable(nodo);
                    if (elementoVisual) {
                        contenedor.appendChild(elementoVisual);
                    }
                }
            })
            .catch(error => {
                document.getElementById('vista-xml').textContent = 'Error al cargar el archivo XML.';
                console.error(error);
            });

        function construirArbolColapsable(nodo) {
            if (nodo.nodeType === Node.TEXT_NODE) {
                if (nodo.nodeValue.trim() === '') return null;
                const span = document.createElement('span');
                span.className = 'texto-contenido';
                span.textContent = nodo.nodeValue.trim();
                return span;
            }

            if (nodo.nodeType === Node.COMMENT_NODE) {
                const divComentario = document.createElement('div');
                divComentario.className = 'comentario-xml';
                divComentario.textContent = ` ${nodo.nodeValue.trim()} `;
                return divComentario;
            }

            if (nodo.nodeType === Node.ELEMENT_NODE) {
                let atributosHtml = '';
                for (let attr of nodo.attributes) {
                    atributosHtml += ` <span class="atributo-nombre">${attr.name}</span>="<span class="atributo-valor">${attr.value}</span>"`;
                }

                let tieneHijosComplejos = false;
                for (let i = 0; i < nodo.childNodes.length; i++) {
                    if (nodo.childNodes[i].nodeType === Node.ELEMENT_NODE || nodo.childNodes[i].nodeType === Node.COMMENT_NODE) {
                        tieneHijosComplejos = true;
                        break;
                    }
                }

                if (!tieneHijosComplejos) {
                    const div = document.createElement('div');
                    const contenido = nodo.textContent.trim();

                    if (contenido) {
                        div.innerHTML = `&lt;${nodo.nodeName}${atributosHtml}&gt;<span class="texto-contenido">${contenido}</span>&lt;/${nodo.nodeName}&gt;`;
                    } else {
                        div.innerHTML = `&lt;${nodo.nodeName}${atributosHtml} /&gt;`;
                    }
                    return div;
                }

                const details = document.createElement('details');
                details.open = true;

                const summary = document.createElement('summary');
                summary.innerHTML = `&lt;${nodo.nodeName}${atributosHtml}&gt;`;
                details.appendChild(summary);

                for (let hijo of nodo.childNodes) {
                    const nodoVisual = construirArbolColapsable(hijo);
                    if (nodoVisual) {
                        details.appendChild(nodoVisual);
                    }
                }

                const cierre = document.createElement('div');
                cierre.className = 'etiqueta-cierre';
                cierre.innerHTML = `&lt;/${nodo.nodeName}&gt;`;
                details.appendChild(cierre);

                return details;
            }

            return null;
        }

            const botonSubir = document.getElementById("btnSubir");

            window.onscroll = function () {
                if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
                    botonSubir.classList.add("mostrar");
                } else {
                    botonSubir.classList.remove("mostrar");
                }
            };

            botonSubir.addEventListener("click", function (evento) {
                evento.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
    </script>
</body>

</html>
